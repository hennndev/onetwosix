; Supervisor worker — Laravel queue (printer receipt)
; Usage:
;   sudo ln -s "$PWD/deploy/supervisor/126club-worker.conf" /etc/supervisor/conf.d/126club-worker.conf
;   sudo supervisorctl reread && sudo supervisorctl update
;   sudo supervisorctl status 126club-worker:*
;
; Notes:
;   - USER/GROUP: sesuaikan dengan user yang menjalankan web server (www-data / deploy).
;   - stopwaitsecs 3600: beri waktu job print selesai (job timeout max 60s + grace).
;   - Ganti `--queue` bila memakai queue nama lain (mis. `print,default`).

[program:126club-worker]
process_name=%(program_name)s_%(process_num)02d
command=php /var/www/126club/artisan queue:work database --queue=print,default --sleep=3 --tries=3 --timeout=60 --max-time=86400 --memory=128
autostart=true
autorestart=true
stopasgroup=true
killasgroup=true
stopwaitsecs=3600
user=www-data
redirect_stderr=true
stdout_logfile=/var/www/126club/storage/logs/queue-worker.log
stdout_logfile_maxbytes=10MB
stdout_logfile_backups=5
numprocs=2
